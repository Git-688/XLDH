<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八合一图片工具箱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 图标 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind 与查询工具完全一致 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4263EB',
                        secondary: '#F5F7FA',
                        darkSecondary: '#2D2D2D',
                        neutral: '#E5E7EB',
                        darkNeutral: '#3D3D3D',
                        textPrimary: '#374151',
                        darkTextPrimary: '#E0E0E0',
                        textSecondary: '#6B7280',
                        darkTextSecondary: '#A0A0A0',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }
            .dark .card-shadow {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }
            .search-focus {
                box-shadow: 0 0 0 3px rgba(66, 99, 235, 0.1);
            }
            .dark .search-focus {
                box-shadow: 0 0 0 3px rgba(66, 99, 235, 0.2);
            }
            .btn-active {
                background-color: #4263EB !important;
                color: white !important;
            }
            .circle-btn {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            }
            .tab-active {
                color: #4263EB;
                border-bottom: 2px solid #4263EB;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-textPrimary dark:text-darkTextPrimary min-h-screen flex flex-col transition-colors duration-300 text-sm">

    <!-- 1. 头部导航 - 与查询工具完全一致 -->
    <header class="sticky top-0 z-50 bg-white dark:bg-gray-900 border-b border-neutral dark:border-darkNeutral backdrop-blur-sm bg-white/90 dark:bg-gray-900/90 transition-colors duration-300">
        <div class="container mx-auto px-4 py-2 flex items-center justify-center relative">
            <h1 class="text-base font-bold text-primary flex items-center">
                <i class="fa fa-picture-o mr-1.5"></i>图片工具箱
            </h1>
            <div class="flex items-center gap-2 absolute right-4">
                <button id="themeToggle" class="circle-btn bg-secondary dark:bg-darkSecondary hover:bg-primary hover:text-white transition-colors">
                    <i class="fa fa-moon-o dark:hidden text-xs"></i>
                    <i class="fa fa-sun-o hidden dark:inline-block text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 2. 功能标签栏 - 与查询工具完全一致的下划线样式 -->
    <section class="border-b border-neutral dark:border-darkNeutral bg-white dark:bg-gray-900 transition-colors duration-300">
        <div class="container mx-auto px-4 flex gap-6 justify-start flex-nowrap overflow-x-auto scrollbar-hide">
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent tab-active whitespace-nowrap" data-mode="1">去水印</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="2">转线稿</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="3">AI绘画</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="4">图片重绘</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="5">图片抠图</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="6">图片扩图</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="7">变清晰</button>
            <button class="tab-btn py-2.5 text-sm font-medium border-b-2 border-transparent text-textSecondary dark:text-darkTextSecondary hover:text-primary transition-colors whitespace-nowrap" data-mode="8">图片叠加</button>
        </div>
    </section>

    <!-- 3. 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-4">
        
        <!-- 功能输入卡片 -->
        <section class="mb-6">
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 border border-neutral dark:border-darkNeutral card-shadow">
                <!-- 去水印 -->
                <div class="func-panel" data-panel="1">
                    <h2 class="text-sm font-semibold mb-3">去水印</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片链接</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="watermark-url" placeholder="请输入需要去水印的图片地址">
                </div>

                <!-- 转线稿 -->
                <div class="func-panel hidden" data-panel="2">
                    <h2 class="text-sm font-semibold mb-3">转线稿</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片链接</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="line-url" placeholder="请输入图片地址">
                </div>

                <!-- AI绘画 -->
                <div class="func-panel hidden" data-panel="3">
                    <h2 class="text-sm font-semibold mb-3">AI绘画</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">绘画描述</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm mb-3" data-id="draw-text" placeholder="例如：二次元猫娘、海边日落">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">绘画风格</label>
                            <select class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="draw-style">
                                <option>二次元</option><option>卡通</option><option>古风</option><option>人像摄影</option>
                                <option>电影写真</option><option>插画</option><option>宫崎骏</option><option>赛博朋克</option>
                                <option>复古胶片</option><option>莫奈画作</option><option>梵高风格</option><option>风景</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片比例</label>
                            <select class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="draw-ratio">
                                <option>1:1</option><option>4:3</option><option>16:9</option><option>3:4</option><option>9:16</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 图片重绘 -->
                <div class="func-panel hidden" data-panel="4">
                    <h2 class="text-sm font-semibold mb-3">图片重绘</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片链接</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm mb-3" data-id="redraw-url" placeholder="请输入需要重绘的图片地址">
                    
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">重绘等级</label>
                    <select class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="redraw-level">
                        <option value="1">1级</option><option value="2">2级</option><option value="3" selected>3级</option>
                        <option value="4">4级</option><option value="5">5级</option><option value="6">6级</option>
                    </select>
                </div>

                <!-- 图片抠图 -->
                <div class="func-panel hidden" data-panel="5">
                    <h2 class="text-sm font-semibold mb-3">图片抠图</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片链接</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="cutout-url" placeholder="请输入需要抠图的图片地址">
                </div>

                <!-- 图片扩图 -->
                <div class="func-panel hidden" data-panel="6">
                    <h2 class="text-sm font-semibold mb-3">图片扩图</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片链接</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm mb-3" data-id="expand-url" placeholder="请输入需要扩图的图片地址">
                    
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">扩图比例</label>
                    <select class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="expand-ratio">
                        <option value="1:1" selected>1:1</option><option value="4:3">4:3</option><option value="3:4">3:4</option>
                    </select>
                </div>

                <!-- 变清晰 -->
                <div class="func-panel hidden" data-panel="7">
                    <h2 class="text-sm font-semibold mb-3">变清晰</h2>
                    <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1">图片链接</label>
                    <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-id="sharpen-url" placeholder="请输入需要优化的图片地址">
                </div>

                <!-- 图片叠加 -->
                <div class="func-panel hidden" data-panel="8">
                    <h2 class="text-sm font-semibold mb-3">图片叠加</h2>
                    <div class="space-y-4">
                        <!-- 表图 -->
                        <div>
                            <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1.5">表图</label>
                            <div class="flex gap-2 mb-2">
                                <button type="button" class="px-2.5 py-1 rounded text-xs bg-primary text-white" data-oly-type="table" data-oly-mode="local">本地上传</button>
                                <button type="button" class="px-2.5 py-1 rounded text-xs bg-secondary dark:bg-darkSecondary text-textSecondary dark:text-darkTextSecondary" data-oly-type="table" data-oly-mode="url">网络URL</button>
                            </div>
                            <div data-oly-box="table-local">
                                <label class="block border-2 border-dashed border-neutral dark:border-darkNeutral rounded-lg p-3 h-28 flex items-center justify-center cursor-pointer hover:border-primary transition-colors">
                                    <input type="file" accept="image/*" class="hidden" data-oly-upload="table" />
                                    <img class="max-h-full max-w-full object-contain hidden" data-oly-preview="table" />
                                    <span class="text-textSecondary dark:text-darkTextSecondary text-xs" data-oly-tip="table">点击上传表图</span>
                                </label>
                            </div>
                            <div class="hidden" data-oly-box="table-url">
                                <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-oly-input="table" placeholder="输入表图网络URL">
                            </div>
                        </div>
                        <!-- 里图 -->
                        <div>
                            <label class="block text-xs text-textSecondary dark:text-darkTextSecondary mb-1.5">里图</label>
                            <div class="flex gap-2 mb-2">
                                <button type="button" class="px-2.5 py-1 rounded text-xs bg-primary text-white" data-oly-type="rito" data-oly-mode="local">本地上传</button>
                                <button type="button" class="px-2.5 py-1 rounded text-xs bg-secondary dark:bg-darkSecondary text-textSecondary dark:text-darkTextSecondary" data-oly-type="rito" data-oly-mode="url">网络URL</button>
                            </div>
                            <div data-oly-box="rito-local">
                                <label class="block border-2 border-dashed border-neutral dark:border-darkNeutral rounded-lg p-3 h-28 flex items-center justify-center cursor-pointer hover:border-primary transition-colors">
                                    <input type="file" accept="image/*" class="hidden" data-oly-upload="rito" />
                                    <img class="max-h-full max-w-full object-contain hidden" data-oly-preview="rito" />
                                    <span class="text-textSecondary dark:text-darkTextSecondary text-xs" data-oly-tip="rito">点击上传里图</span>
                                </label>
                            </div>
                            <div class="hidden" data-oly-box="rito-url">
                                <input type="text" class="w-full px-3 py-2 rounded-lg border border-neutral dark:border-darkNeutral bg-white dark:bg-gray-800 focus:border-primary focus:outline-none focus:search-focus transition-all text-sm" data-oly-input="rito" placeholder="输入里图网络URL">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 提交按钮 - 与查询工具按钮风格一致 -->
                <button id="globalSubmit" class="w-full mt-4 bg-primary text-white px-3 py-2 rounded-md hover:bg-primary/90 transition-colors text-sm font-medium flex items-center justify-center gap-1.5">
                    <i class="fa fa-magic text-xs"></i>
                    <span>开始处理</span>
                </button>
            </div>
        </section>

        <!-- 加载状态 - 与查询工具完全一致 -->
        <section id="loadingSection" class="hidden flex-col items-center justify-center py-12">
            <div class="w-10 h-10 border-3 border-neutral dark:border-darkNeutral border-t-primary rounded-full animate-spin mb-3"></div>
            <p class="text-textSecondary dark:text-darkTextSecondary text-xs text-center">正在处理中...</p>
        </section>

        <!-- 错误提示 - 与查询工具完全一致 -->
        <section id="errorSection" class="hidden flex-col items-center justify-center py-12">
            <i class="fa fa-exclamation-circle text-3xl text-red-500 mb-3"></i>
            <p class="text-textSecondary dark:text-darkTextSecondary mb-2 text-xs text-center" id="errorMessage">处理失败，请稍后重试</p>
            <button id="retryBtn" class="mt-3 px-3 py-1.5 border border-primary text-primary rounded-md hover:bg-primary hover:text-white transition-colors text-xs">
                重新处理
            </button>
        </section>

        <!-- 初始空状态 - 与查询工具完全一致 -->
        <section id="emptySection" class="flex flex-col items-center justify-center py-12">
            <i class="fa fa-picture-o text-3xl text-neutral dark:text-darkNeutral mb-3"></i>
            <p class="text-textSecondary dark:text-darkTextSecondary text-xs text-center">请选择功能并输入内容</p>
            <p class="text-textSecondary/80 dark:text-darkTextSecondary/80 text-xs mt-1 text-center">点击开始处理获取结果</p>
        </section>

        <!-- 结果区域 -->
        <section id="resultsSection" class="hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-semibold">处理结果</h2>
            </div>
            <!-- AI绘画专属说明 -->
            <div id="drawOnlyInfo" class="mb-3 p-3 bg-primary/5 rounded-lg text-xs space-y-1 hidden">
                <p class="font-medium text-primary" id="drawOnlyMsg"></p>
                <p class="text-textSecondary dark:text-darkTextSecondary leading-relaxed" id="drawOnlyDesc"></p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="resultsList">
                <!-- 结果图片动态生成 -->
            </div>
        </section>
    </main>

    <!-- 图片放大弹窗 -->
    <div id="imgModal" class="fixed inset-0 bg-black/95 z-50 hidden items-center justify-center p-4">
        <img id="modalImg" class="max-h-[90vh] max-w-[90vw] rounded-lg">
    </div>

    <script>
        // 全局常量
        const FUNC_MODE = {
            WATERMARK: 1, LINE: 2, DRAW: 3, REDRAW: 4,
            CUTOUT: 5, EXPAND: 6, SHARPEN: 7, OVERLAY: 8
        };
        const API_KEY = '5c7f37a79ce1eef4eb1b79dc5d7a752ab139ac681ce02447389e6fc6a2eb5a52';
        const API_MAP = {
            [FUNC_MODE.WATERMARK]: 'https://missqiu.icu/API/baiduqsy.php',
            [FUNC_MODE.LINE]: 'https://missqiu.icu/API/baidutqxg.php',
            [FUNC_MODE.DRAW]: 'https://missqiu.icu/API/baidudraw.php',
            [FUNC_MODE.REDRAW]: 'https://missqiu.icu/API/baiduch.php',
            [FUNC_MODE.CUTOUT]: 'https://missqiu.icu/API/baidukoutu.php',
            [FUNC_MODE.EXPAND]: 'https://missqiu.icu/API/baidukt.php',
            [FUNC_MODE.SHARPEN]: 'https://missqiu.icu/API/baiduimage.php',
            [FUNC_MODE.OVERLAY]: 'https://api.pearktrue.cn/api/phantom_tank'
        };

        let currentFuncMode = FUNC_MODE.WATERMARK;
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadThemePreference();
            bindEvents();
            toggleSections('empty');
        });

        // 加载主题偏好
        function loadThemePreference() {
            const savedTheme = localStorage.getItem('theme');
            const isDarkMode = savedTheme === 'dark' || 
                              (savedTheme === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // 切换主题
        function toggleTheme() {
            const isDarkMode = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        }

        // 绑定事件
        function bindEvents() {
            // 主题切换
            $('#themeToggle').addEventListener('click', toggleTheme);
            
            // 标签切换
            $$('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchTab(Number(btn.dataset.mode));
                });
            });

            // 提交按钮
            $('#globalSubmit').addEventListener('click', handleSubmit);
            $('#retryBtn').addEventListener('click', handleSubmit);

            // 图片叠加模块初始化
            initOverlayModule();

            // 弹窗关闭
            $('#imgModal').addEventListener('click', () => {
                $('#imgModal').classList.add('hidden');
                $('#imgModal').classList.remove('flex');
            });
        }

        // 切换标签
        function switchTab(mode) {
            currentFuncMode = mode;
            
            // 更新标签样式
            $$('.tab-btn').forEach(btn => {
                if (Number(btn.dataset.mode) === mode) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-textSecondary', 'dark:text-darkTextSecondary');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-textSecondary', 'dark:text-darkTextSecondary');
                }
            });

            // 切换功能面板
            $$('.func-panel').forEach(panel => {
                panel.classList.toggle('hidden', Number(panel.dataset.panel) !== mode);
            });

            // 重置状态
            toggleSections('empty');
        }

        // 图片叠加模块
        function initOverlayModule() {
            let modeMap = { table: 'local', rito: 'local' };

            // 切换模式
            $$('[data-oly-type]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.olyType;
                    const mode = btn.dataset.olyMode;
                    modeMap[type] = mode;

                    $$(`[data-oly-type="${type}"]`).forEach(b => {
                        if (b.dataset.olyMode === mode) {
                            b.classList.add('bg-primary', 'text-white');
                            b.classList.remove('bg-secondary', 'dark:bg-darkSecondary', 'text-textSecondary', 'dark:text-darkTextSecondary');
                        } else {
                            b.classList.remove('bg-primary', 'text-white');
                            b.classList.add('bg-secondary', 'dark:bg-darkSecondary', 'text-textSecondary', 'dark:text-darkTextSecondary');
                        }
                    });

                    $$(`[data-oly-box^="${type}-"]`).forEach(box => {
                        box.classList.toggle('hidden', !box.dataset.olyBox.endsWith(mode));
                    });
                });
            });

            // 预览图
            $$('[data-oly-upload]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const type = e.target.dataset.olyUpload;
                    const file = e.target.files[0];
                    if (!file) return;
                    $(`[data-oly-preview="${type}"]`).src = URL.createObjectURL(file);
                    $(`[data-oly-preview="${type}"]`).classList.remove('hidden');
                    $(`[data-oly-tip="${type}"]`).classList.add('hidden');
                });
            });

            // 暴露获取数据方法
            window.getOverlayData = function() {
                const data = { formData: new FormData(), error: '' };
                
                if (modeMap.table === 'local') {
                    const file = $('[data-oly-upload="table"]').files[0];
                    if (!file) data.error = '请选择表图';
                    else data.formData.append('table_chart_image', file);
                } else {
                    const url = $('[data-oly-input="table"]').value.trim();
                    if (!url) data.error = '请输入表图URL';
                    else data.formData.append('table_chart_image', url);
                }

                if (!data.error) {
                    if (modeMap.rito === 'local') {
                        const file = $('[data-oly-upload="rito"]').files[0];
                        if (!file) data.error = '请选择里图';
                        else data.formData.append('rito_image', file);
                    } else {
                        const url = $('[data-oly-input="rito"]').value.trim();
                        if (!url) data.error = '请输入里图URL';
                        else data.formData.append('rito_image', url);
                    }
                }
                return data;
            };
        }

        // 处理提交
        function handleSubmit() {
            const submitData = getSubmitData();
            if (submitData.error) {
                showToast(submitData.error);
                return;
            }

            toggleSections('loading');
            $('#globalSubmit').disabled = true;

            const requestOptions = {
                method: submitData.method,
                body: submitData.data || null
            };

            fetch(submitData.url, requestOptions)
                .then(response => {
                    if (!response.ok) throw new Error('网络请求失败');
                    return response.text();
                })
                .then(text => {
                    const data = safeParse(text);
                    const imgList = handleResult(data);
                    
                    if (imgList.length > 0) {
                        renderResults(imgList);
                        toggleSections('results');
                    } else {
                        $('#errorMessage').textContent = '未获取到有效图片';
                        toggleSections('error');
                    }
                })
                .catch(error => {
                    console.error('处理错误:', error);
                    $('#errorMessage').textContent = '网络异常，请检查网络连接后重试';
                    toggleSections('error');
                })
                .finally(() => {
                    $('#globalSubmit').disabled = false;
                });
        }

        // 获取提交数据
        function getSubmitData() {
            const result = { url: '', data: null, method: 'GET', error: '' };

            switch (currentFuncMode) {
                case FUNC_MODE.WATERMARK:
                    const wUrl = $('[data-id="watermark-url"]').value.trim();
                    result.url = wUrl;
                    result.error = wUrl ? '' : '请输入图片链接';
                    break;

                case FUNC_MODE.LINE:
                    const lUrl = $('[data-id="line-url"]').value.trim();
                    result.url = lUrl;
                    result.error = lUrl ? '' : '请输入图片链接';
                    break;

                case FUNC_MODE.DRAW:
                    const text = $('[data-id="draw-text"]').value.trim();
                    const style = $('[data-id="draw-style"]').value;
                    const ratio = $('[data-id="draw-ratio"]').value;
                    if (!text) {
                        result.error = '请输入绘画描述';
                    } else {
                        result.url = `${API_MAP[currentFuncMode]}?text=${encodeURIComponent(text)}&style=${encodeURIComponent(style)}&ratio=${encodeURIComponent(ratio)}&apikey=${API_KEY}`;
                    }
                    break;

                case FUNC_MODE.REDRAW:
                    const rUrl = $('[data-id="redraw-url"]').value.trim();
                    const rLevel = $('[data-id="redraw-level"]').value;
                    if (!rUrl) {
                        result.error = '请输入重绘图片链接';
                    } else {
                        result.url = `${API_MAP[currentFuncMode]}?url=${encodeURIComponent(rUrl)}&gs=${rLevel}&type=json&apikey=${API_KEY}`;
                    }
                    break;

                case FUNC_MODE.CUTOUT:
                    const cUrl = $('[data-id="cutout-url"]').value.trim();
                    if (!cUrl) {
                        result.error = '请输入抠图图片链接';
                    } else {
                        result.url = `${API_MAP[currentFuncMode]}?url=${encodeURIComponent(cUrl)}&type=json&apikey=${API_KEY}`;
                    }
                    break;

                case FUNC_MODE.EXPAND:
                    const eUrl = $('[data-id="expand-url"]').value.trim();
                    const eRatio = $('[data-id="expand-ratio"]').value;
                    if (!eUrl) {
                        result.error = '请输入扩图图片链接';
                    } else {
                        result.url = `${API_MAP[currentFuncMode]}?url=${encodeURIComponent(eUrl)}&gs=${encodeURIComponent(eRatio)}&type=json&apikey=${API_KEY}`;
                    }
                    break;

                case FUNC_MODE.SHARPEN:
                    const sUrl = $('[data-id="sharpen-url"]').value.trim();
                    if (!sUrl) {
                        result.error = '请输入图片链接';
                    } else {
                        result.url = `${API_MAP[currentFuncMode]}?url=${encodeURIComponent(sUrl)}&type=json&apikey=${API_KEY}`;
                    }
                    break;

                case FUNC_MODE.OVERLAY:
                    const olyData = getOverlayData();
                    result.error = olyData.error;
                    result.data = olyData.formData;
                    result.url = API_MAP[currentFuncMode];
                    result.method = 'POST';
                    break;
            }
            return result;
        }

        // 处理返回结果
        function handleResult(data) {
            let imgList = [];

            switch (currentFuncMode) {
                case FUNC_MODE.DRAW:
                    if (data.msg) $('#drawOnlyMsg').textContent = data.msg;
                    if (data.text) $('#drawOnlyDesc').textContent = data.text;
                    $('#drawOnlyInfo').classList.remove('hidden');

                    let rawImgList = [];
                    if (data.image_url) rawImgList = Array.isArray(data.image_url) ? data.image_url : [data.image_url];
                    else if (data.images) rawImgList = Array.isArray(data.images) ? data.images : [data.images];
                    else if (data.img) rawImgList = Array.isArray(data.img) ? data.img : [data.img];
                    
                    imgList = rawImgList.filter(src => src && typeof src === 'string' && src.startsWith('http'));
                    break;

                case FUNC_MODE.OVERLAY:
                    if (data.code === 200 && data.image_url) {
                        imgList = [data.image_url];
                    }
                    break;

                default:
                    const url = data.url || data.img || data.raw || '';
                    imgList = url.startsWith('http') ? [url] : [];
                    break;
            }
            return imgList;
        }

        // 渲染结果图片
        function renderResults(imgList) {
            const container = $('#resultsList');
            container.innerHTML = '';

            imgList.forEach(src => {
                if (!src.startsWith('http')) return;
                const img = document.createElement('img');
                img.src = src;
                img.className = 'w-full h-auto rounded-lg border border-neutral dark:border-darkNeutral card-shadow cursor-pointer hover:border-primary/30 transition-all';
                img.addEventListener('click', () => {
                    $('#modalImg').src = src;
                    $('#imgModal').classList.remove('hidden');
                    $('#imgModal').classList.add('flex');
                });
                container.appendChild(img);
            });
        }

        // 切换显示区域
        function toggleSections(showSection) {
            const sections = ['results', 'loading', 'error', 'empty'];
            sections.forEach(section => {
                const element = document.getElementById(`${section}Section`);
                element.classList.add('hidden');
                element.classList.remove('flex');
            });
            const target = document.getElementById(`${showSection}Section`);
            target.classList.remove('hidden');
            target.classList.add('flex');
        }

        // 安全解析JSON
        function safeParse(str) {
            try { return JSON.parse(str) } catch (e) { return { raw: str?.trim() || '' } }
        }

        // 全局提示
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg bg-black/80 text-white text-xs z-50 backdrop-blur-sm';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
